          `**Церковь Петра и Павла в Креницах**, построенная в духе провинциального барокко с классицистической колокольней, является древнейшим в селе зданием и, несмотря на переделки, относится к ценным архитектурно-историческим объектам. Она является главной постройкой комплекса, включающего кладбищенские ворота и ряд исторических надгробий. В перспективе одноимённой селу улицы Креницы **церковная колокольня выполняет роль высотной архитектурной доминаты**.

**Креницы** расположены при впадении реки Волхов в Ладожское озеро, омывающих село с востока и севера соответственно. Южная граница образована Старо- и Новоладожскими каналами, за которыми простирается Новая Ладога. Первое упоминание деревни Креницы в Пречистенском Городенском погосте на земле Николо-Медведского монастыря (упразднён в 1704 г.) встречается в переписной книге Вотской пятины за 1500 (7008) г. С 1568 г. в Креницах существовало две деревянные церкви – Илии Пророка и Петра и Павла. В 1777 г. на месте сгоревшей Ильинской церкви построена часовня того же посвящения (впоследствии приписана к Петропавловской церкви). Вместо прежней деревянной **в 1756 г. построена и освящена новая каменная пятиглавая церковь Петра и Павла**, о чём косвенно свидетельствует надпись на октоихе, изданном в Москве в 1756 г.: «Сия книга святого Пречистенского городенского погоста, выставки \\[выселке] Криниц, церкви Петра и Павла, подписана марта 18 дня 1758 года». В дореволюционной литературе встречается версия, что существующая церковь возведена в посл. четв. 18 в., не позднее 1785–86 гг. Храм подвергался многочисленным перестройкам, среди которых выделяются работы 1803–04 гг. по сооружению прихожанами классицистической колокольни и северного придела Вознесения Господня. Вероятно, в результате этих работ, традиционная продольно-осевая композиция, включающая четверик с апсидой и трапезной, была расширена пристройкой северного объёма. Обновлённый храм получил достаточно редкую двухапсидную композицию с обособленными входами с запада в главную церковь (оставлен на прежнем месте и отмечен нишей-киотом) и придельную. Не исключено, что проект перестройки разрабатывался под влиянием архитектуры Успенской церкви близлежащего села Сясьские Рядки, имевшей две равноценные апсиды.

В **1804 г.** был установлен деревянный резной вызолоченный иконостас, устроенный на пожертвования прихожан мастером Абросимовым (не сохр.). Иконы для него выполнены иконописцем Фадеевым в греческом вкусе. Антиминс придела освящён 23 февраля 1804 г., главного алтаря – 19 сентября 1830 г. На фотографиях начала 20 в. запечатлены трёхъярусные главный и придельный иконостасы в семь и пять осей соответственно, выполненные в русско-византийском стиле с позолоченными резными элементами на белом фоне. Оба – не сохранились.

В 1854 г. к церкви приписано два участка земли. Прямоугольное кладбище с церковью, распложённые в створе главной сельской улицы, вошли в восточную часть меньшего из участков (4,4 га), который имел форму вытянутой по оси север-юг трапеции. На этом же участке к 1870 г. выстроен новый дом причта – деревянный двухэтажный на каменном фундаменте крытый железом, обошедшийся в 3000 руб., с сараем для дров (не сохр.); к концу 19 в. на западной стороне участка возведено здание церковно-приходской школы. Больший участок площадью 31,6 га, также находящийся вблизи церкви, не обрабатывался из-за недостатка средств. К церкви были приписаны четыре часовни (все утрачены) – во имя Илии, во имя Воздвижения (к юго-западу от села), также во имя Воздвижения (на пути в Новую Ладогу) и Тихвинской Божией Матери (в Немятове, построена в 1859 г. на месте прежней).

**Церковь Петра и Павла закрылась в 1937 г. Ныне она пребывает в руинированном состоянии.**

Около храма находится несколько старых надгробий, в том числе парные в виде обелисков к югу от церкви и металлический ажурный крест на кубическом гранитном постаменте над могилой священника Покровского к западу. Ограда с воротами сохранилась с некоторыми утратами. В 2010-х гг. в северной части колокольни устроена часовня.

Постройки комплекса сложены из кирпича с применением лекальных элементов, побелены.

Здание церкви приобрело незначительную асимметрию в результате перестроек. Композиция включает основной прямоугольный объём, ранее перекрытый вальмовой крышей, над которым в восточной части находился ныне утраченный компактный четверик с пятью главами на глухих гранёных барабанах; над западной частью, с лёгким смещением к югу от продольной оси, возвышаются три яруса колокольни, которая завершалась выпуклой четырёхгранной кровлей со срезанными углами и высоким шпилем.  С востока расположены две почти равные по размеру полукруглые абсиды под общим трёхскатным покрытием. Углы основного объёма выпущены между пилястрами с импостами, крепующими ступенчатый венчающий карниз и тонкий валик под ним. Такими же пилястрами каждая апсида разделена на три прясла, а боковые фасады расчленены на четыре. При этом восточное прясло на северном фасаде длиннее соответствующего ему на южном, а по оси центральной главы расположены одинаковые узкие прясла.

Углы надстроенного четверика были отмечены огибающими лопатками, над которыми располагалась тонкая полочка. Фасады, кроме западного, частично закрытого примыкающей кровлей, были оформлены тремя лежачими филёнками: в центральной помещена накладка в виде треугольника, окружённого сиянием, в боковых – в виде ромбов. Такими же ромбовидными накладками в нишах на гранёном барабане центральной главы отмечены страны света.

На западном фасаде среднее из трёх прясел, отвечающее основанию колокольни, выделено лёгкой раскреповкой. Оно оформлено парой рустованных лопаток и французским рустом над заложенной (ложной?) аркой входа. В боковых пряслах прорезаны прямоугольные входные проёмы: в южном – со смещением влево, в более широком северном – по середине. Три надстроенных яруса колокольни включают два глухих четверика со скруглёнными углами (первый более низкий), и верхний, представляющий собой слегка убывающий по площади ярус звона, углы которого срезаны. Завершение каждого яруса отмечено ступенчатым карнизом. Грани двух нижних четвериков оформлены глухими арочными нишами. Во втором четверике они фланкированы лопатками, крепующими карниз.

Окна устроены в каждом прясле церкви (кроме левого на западном фасаде), средние окна абсид – ложные.  Проёмы с лучковыми перемычками, заключенные в кирпичные рамочные наличники, оформлены веерными замковыми камнями. Наличники дополнены ушами с подвесками и завершены прямыми профилированными сандриками (в узких пряслах на боковых фасадах сандрики лучковые с плечиками). В дореволюционный период окна южного фасада подверглись изменениям – уменьшили высоту и придали им прямоугольную форму.

В интерьере основное пространство церкви и придел, разделенные капитальной кирпичной стеной, сообщались двумя проёмами.

Трёхчастные кирпичные ворота расположены с небольшим смещением к северу от продольной оси церкви. Они представляют собой трёхпролётную арку с более высоким и широким средним проездом и меньшими по размерам боковыми. Пяты арочных проёмом отмечены импостами, поддерживающими широкие гладкие архивольты. Над центральной аркой установлена четырёхгранная со срезанными углами миниатюрная тумба с киотом, увенчанная крестом.
